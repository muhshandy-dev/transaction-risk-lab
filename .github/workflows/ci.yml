name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests tools
      - run: pytest -q
      - name: Smoke run of the whole protocol on a tiny dataset
        run: txrisk run --small --data "$RUNNER_TEMP/data" --out "$RUNNER_TEMP/reports" --threads 2
      - name: Committed reports are internally consistent
        run: python tools/check_reports.py reports

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -p tsconfig.json
      - name: Browser models match Python (prediction and TreeSHAP)
        run: npx vitest run
      - run: npx vite build
