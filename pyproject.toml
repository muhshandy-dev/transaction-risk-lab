[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "txrisk"
version = "0.1.0"
description = "Explainable transaction risk modelling: logistic baseline vs LightGBM, PR-AUC, recall@budget, calibration, SHAP"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "shap>=0.46",
  "faker==13.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
txrisk = "txrisk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
txrisk = ["sparkov/profiles/*.json", "sparkov/data/*.csv", "sparkov/LICENSE.md", "sparkov/PATCHES.md"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/txrisk/sparkov/customer.py", "src/txrisk/sparkov/transaction.py", "src/txrisk/sparkov/profile_weights.py", "src/txrisk/sparkov/main_config.py", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
